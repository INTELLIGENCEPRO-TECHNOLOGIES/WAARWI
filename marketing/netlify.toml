[build]
  command = "npm run build"
  publish = "dist"

# Ensure pages are not flagged as redirects — explicit X-Robots-Tag
[[headers]]
  for = "/"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/mentions-legales"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/confidentialite"
  [headers.values]
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/cgu"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Legal pages — explicitly serve the SPA shell (not a redirect)
[[redirects]]
  from = "/mentions-legales"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/cgu"
  to = "/index.html"
  status = 200

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Ensure sitemap and robots are served with correct content type
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
