        <h1>Waarwi │ Gestion commerciale tout-en-un pour les commerçants sénégalais</h1>
        <p>Caisse, stock, facturation et boutique en ligne réunis dans une seule plateforme. Conçu au Sénégal pour les commerçants sénégalais. Essai gratuit 14 jours, sans carte bancaire.</p>

        <h2>Fonctionnalités</h2>
        <ul>
          <li><strong>Point de vente</strong> — Caisse rapide et intuitive, encaissement multi-moyens, sessions de caisse sécurisées.</li>
          <li><strong>Stock &amp; inventaire</strong> — Suivi en temps réel, alertes de rupture, gestion par lot et par site.</li>
          <li><strong>Facturation</strong> — Devis, factures, avoirs et retours conformes, conversion en vente en un clic.</li>
          <li><strong>Clients &amp; tiers</strong> — CRM complet, suivi des créances, plafonds de crédit et historique d'achat.</li>
          <li><strong>Fournisseurs</strong> — Commandes d'achat, réception, suivi des dettes et règlements.</li>
          <li><strong>Boutique en ligne</strong> — Vitrine web personnalisée, commandes en ligne, paiement à la livraison.</li>
          <li><strong>Comptabilité</strong> — Plan comptable SYSCOHADA, journal, balance, grand livre et clôture.</li>
          <li><strong>Rapports</strong> — Tableaux de bord, analyses de ventes, marges et performance par produit.</li>
          <li><strong>Sécurité &amp; rôles</strong> — Permissions granulaires par utilisateur, journaux d'activité, sauvegardes.</li>
        </ul>

        <h2>Secteurs d'activité</h2>
        <p>Pièces auto, textile, électroménager, smartphones, cosmétique, pharmacie, quincaillerie, librairie, mercerie, alimentaire, services et bijouterie — avec des catalogues pré-remplis pour chaque secteur.</p>

        <h2>Pourquoi Waarwi ?</h2>
        <ul>
          <li><strong>Conçu au Sénégal</strong> — Une solution pensée pour les réalités du commerce sénégalais.</li>
          <li><strong>Accompagnement local</strong> — Une équipe sur place pour vous aider au démarrage.</li>
          <li><strong>Sauvegardes &amp; sécurité</strong> — Vos données sont sauvegardées et protégées.</li>
          <li><strong>Multi-utilisateurs</strong> — Vendeurs, caissiers et comptables avec des permissions adaptées.</li>
          <li><strong>Synchronisation temps réel</strong> — Ventes, stock et rapports mis à jour instantanément.</li>
        </ul>

        <h2>Questions fréquentes</h2>
        <h3>Faut-il installer un logiciel ?</h3>
        <p>Non. Waarwi fonctionne directement dans votre navigateur, sur ordinateur, tablette ou téléphone. Aucune installation n'est nécessaire.</p>
        <h3>L'application fonctionne-t-elle sur téléphone ?</h3>
        <p>Oui. Waarwi est accessible depuis un navigateur web sur smartphone, et l'interface de caisse est conçue pour un usage quotidien sur mobile.</p>
        <h3>Les données sont-elles sauvegardées ?</h3>
        <p>Oui. Vos données sont stockées de manière sécurisée et sauvegardées. Vous pouvez également exporter vos informations.</p>
        <h3>Peut-on gérer plusieurs utilisateurs ou magasins ?</h3>
        <p>Oui. Le plan Business inclut plusieurs magasins et plusieurs utilisateurs avec des permissions adaptées à chaque rôle.</p>
        <h3>Comment fonctionne l'essai gratuit ?</h3>
        <p>Vous bénéficiez de 14 jours d'accès sans carte bancaire. À la fin de l'essai, vous choisissez le plan qui vous convient, sans engagement.</p>
