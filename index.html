  <body>
    <script>
      (function(){try{var m=localStorage.getItem('waarwi:theme');var r=m==='dark'?'dark':m==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',r);if(r==='dark'){document.querySelector('meta[name="theme-color"]').setAttribute('content','#111111')}}catch(e){}})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
