name: Recette historique SQL locale (aucun déploiement)
on:
  push:
    branches: [codex/waarwi-comptabilite-suite]
    paths:
      - '.github/workflows/waarwi-historical-replay.yml'
      - 'scripts/pending-accounting/production-migration-versions.json'
      - 'scripts/pending-accounting/history-recovered/**'
      - 'supabase/migrations/**'
      - 'scripts/pending-accounting/integrated-replay-plan.json'
      - 'scripts/pending-accounting/integrated-local-fixture.sql'
      - 'scripts/pending-accounting/*-candidate.sql'
      - 'scripts/pending-accounting/*-recipe.sql'
      - 'tests/browser/**'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  replay:
    if: github.ref == 'refs/heads/codex/waarwi-comptabilite-suite'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventaire exact des fichiers historiques
        id: inventory
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys, os
          manifest=json.loads(pathlib.Path('scripts/pending-accounting/production-migration-versions.json').read_text())
          versions=manifest['versions']
          files={}
          roots=(pathlib.Path('supabase/migrations'), pathlib.Path('scripts/pending-accounting/history-recovered'))
          for path in sorted(p for root in roots for p in root.glob('*.sql')):
              m=re.fullmatch(r'(\d{14})_.+\.sql',path.name)
              if not m: continue
              files.setdefault(m[1],[]).append(path)
          missing=[v for v in versions if v not in files]
          duplicate=[v for v in versions if len(files.get(v,[]))>1]
          extra=sorted(set(files)-set(versions))
          print(f'Production : {len(versions)} versions ; GitHub : {len(files)} versions')
          print('Manquantes :',len(missing),*missing,sep='\n')
          print('Ambiguës :',len(duplicate),*duplicate,sep='\n')
          print('Supplémentaires (non exécutées) :',len(extra),*extra,sep='\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f'## Inventaire historique\nProduction : {len(versions)} ; GitHub : {len(files)} ; absentes : {len(missing)} ; ambiguës : {len(duplicate)} ; supplémentaires : {len(extra)}.\n')
          # Replay strict: stop at the first missing/ambiguous version, never guess or skip it.
          paths=[]
          for version in versions:
              if len(files.get(version,[]))!=1: break
              paths.append(str(files[version][0].resolve()))
          pathlib.Path('/tmp/waarwi-replay-files.txt').write_text('\n'.join(paths)+'\n')
          pathlib.Path('/tmp/waarwi-replay-total.txt').write_text(str(len(versions)))
          print('Préfixe continu rejouable :',len(paths))
          if not paths: sys.exit('Première migration introuvable ou ambiguë')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3
        with:
          version: '2.122.1'
      - name: Initialiser une base PostgreSQL 17 Supabase jetable
        id: initialize
        run: |
          set -euo pipefail
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          work=$(mktemp -d /tmp/waarwi-history.XXXXXX)
          cd "$work"
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY SUPABASE_URL DATABASE_URL
          supabase init
          test -f supabase/config.toml
          sed -i 's/^project_id = .*/project_id = "waarwi_history_replay"/;s/^major_version = .*/major_version = 17/' supabase/config.toml
          grep -qx 'project_id = "waarwi_history_replay"' supabase/config.toml
          grep -qx 'major_version = 17' supabase/config.toml
          # No repository config, migration, seed, remote project link or user secret has been copied.
          # Initialize Realtime locally before isolation.
          supabase start >/tmp/waarwi-local-start.log 2>&1 || { echo 'Initialisation Supabase locale en échec'; tail -8 /tmp/waarwi-local-start.log; exit 1; }
          db=$(docker ps --filter 'name=^/supabase_db_waarwi_history_replay$' --format '{{.ID}}')
          test -n "$db"
          test "$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$db")" != host
          # Realtime must have initialized message partitions before network isolation.
          docker exec -e PGPASSWORD=postgres "$db" psql -X -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_inherits where inhparent='realtime.messages'::regclass" | grep -Eq '^[1-9][0-9]*$'
          (umask 077; supabase status --output env >"${RUNNER_TEMP}/waarwi-local-supabase.env")
          # Cut every network connection BEFORE executing any historic SQL (including pg_net/cron).
          for network in $(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$db"); do
            docker network disconnect -f "$network" "$db"
          done
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          printf '%s\n' "$db" >/tmp/waarwi-replay-container.txt
          docker exec -e PGPASSWORD=postgres "$db" psql -h 127.0.0.1 -U postgres -d postgres -Atc "select current_setting('server_version_num')::int/10000" | grep -qx 17
      - name: Rejouer les fichiers GitHub dans l'ordre de production
        id: replay
        run: |
          set -euo pipefail
          db=$(cat /tmp/waarwi-replay-container.txt)
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          expected=$(cat /tmp/waarwi-replay-total.txt)
          count=0
          while IFS= read -r file; do
            test -n "$file"
            echo "Migration $((count+1))/$expected : $(basename "$file")"
            # SQL sent over stdin inside the isolated container. No production connection.
            if ! docker exec -i -e PGPASSWORD=postgres "$db" psql -X -q -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -v SHOW_CONTEXT=never --single-transaction -f - < "$file" >/tmp/waarwi-replay-last.log 2>&1; then
              # Only line number and SQLSTATE are shown, never SQL data or literal credentials.
              grep -E 'ERROR: *[0-9A-Z]{5}' /tmp/waarwi-replay-last.log | tail -5 || true
              echo "Première migration en échec : $(basename "$file") ; $count migrations précédentes réussies." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            count=$((count+1))
          done </tmp/waarwi-replay-files.txt
          echo "$count/$expected migrations historiques rejouées." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$count" -eq "$expected"
      - name: Emballer et appliquer les migrations candidates versionnées
        id: candidate
        run: |
          set -euo pipefail
          db=$(cat /tmp/waarwi-replay-container.txt)
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          from datetime import datetime, timedelta

          root = pathlib.Path('scripts/pending-accounting')
          plan = json.loads((root / 'integrated-replay-plan.json').read_text())
          history = json.loads((root / 'production-migration-versions.json').read_text())['versions']
          for key in ('candidate_files', 'recipe_files'):
              paths = plan[key]
              assert paths and len(paths) == len(set(paths))
              assert all(pathlib.Path(path).is_file() for path in paths)

          first = datetime.strptime(plan['first_candidate_migration_version'], '%Y%m%d%H%M%S')
          occupied = {p.name.split('_')[0] for p in pathlib.Path('supabase/migrations').glob('*.sql')}
          bundle = pathlib.Path(os.environ['RUNNER_TEMP']) / 'waarwi-ordered-migrations'
          migrations = bundle / 'migrations'
          migrations.mkdir(parents=True, exist_ok=False)
          entries = []
          for index, source in enumerate(map(pathlib.Path, plan['candidate_files'])):
              version = (first + timedelta(seconds=index)).strftime('%Y%m%d%H%M%S')
              assert version > max(history) and version not in occupied, version
              label = re.sub(r'^\d{14}_', '', source.stem)
              label = re.sub(r'[^a-zA-Z0-9_]+', '_', label)
              destination = migrations / f'{version}_{label}.sql'
              content = source.read_bytes()
              assert content.strip(), source
              destination.write_bytes(content)
              entries.append({
                  'version': version,
                  'source': str(source),
                  'path': str(destination.relative_to(bundle)),
                  'sha256': hashlib.sha256(content).hexdigest(),
              })

          (bundle / 'manifest.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'scope': 'Candidat prépublication testé en base isolée',
              'required_history': history,
              'ordered_migrations': entries,
          }, ensure_ascii=False, indent=2) + '\n')
          (bundle / 'SHA256SUMS').write_text(''.join(
              f"{entry['sha256']}  {entry['path']}\n" for entry in entries
          ))
          pathlib.Path('/tmp/waarwi-candidate_files.txt').write_text(''.join(
              f"{bundle / entry['path']}\n" for entry in entries
          ))
          pathlib.Path('/tmp/waarwi-recipe_files.txt').write_text('\n'.join(plan['recipe_files']) + '\n')
          PY
          count=0
          expected=$(wc -l </tmp/waarwi-candidate_files.txt)
          while IFS= read -r file; do
            echo "Candidat $((count+1))/$expected : $(basename "$file")"
            if ! docker exec -i -e PGPASSWORD=postgres "$db" psql -X -q -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v VERBOSITY=default -v SHOW_CONTEXT=never --single-transaction -f - < "$file" >/tmp/waarwi-candidate-last.log 2>&1; then
              grep -E 'ERROR:.*(Ancre |Ancres )' /tmp/waarwi-candidate-last.log | tail -5 || true
              grep -E 'ERROR:' /tmp/waarwi-candidate-last.log | cut -d: -f1-3 | tail -5 || true
              echo "Candidat en échec : $(basename "$file") ; $count précédents réussis." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            count=$((count+1))
          done </tmp/waarwi-candidate_files.txt
          echo "$count/$expected fichiers candidats appliqués." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Préparer les données fictives de recette
        id: fixtures
        run: |
          set -euo pipefail
          db=$(cat /tmp/waarwi-replay-container.txt)
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          docker exec -i -e PGPASSWORD=postgres "$db" psql -X -q -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v SHOW_CONTEXT=never -f - < scripts/pending-accounting/integrated-local-fixture.sql
      - name: Recettes SQL intégrées sans données réelles
        id: recipes
        run: |
          set -euo pipefail
          db=$(cat /tmp/waarwi-replay-container.txt)
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          # Adapt only the synthetic tenant provisioning in the local copies, not the assertions.
          python3 - <<'PY'
          import pathlib, re
          files=pathlib.Path('/tmp/waarwi-recipe_files.txt').read_text().splitlines()
          targets={'44','50','51','52','94','95','111','112','114','117','119','129','139','142','148','150','152','154','156'}
          seen=set()
          out=pathlib.Path('/tmp/waarwi-local-recipes')
          out.mkdir(exist_ok=False)
          paths=[]
          for filename in files:
              p=pathlib.Path(filename)
              number=p.name.split('-')[0]
              if number not in targets:
                  paths.append(filename)
                  continue
              s=p.read_text()
              pattern=r'(?m)^(\s*INSERT INTO public\.tenants\(id,name,enabled_modules[^\n]*;)[ \t]*$'
              def provision(m):
                  line=m.group(1)
                  tenant='control_t' if 'VALUES(control_t,' in line else 't'
                  assert 'VALUES('+tenant+',' in line, p.name
                  # The second tenant in 44/52 is only used for cross-tenant access checks.
                  return line+'\n PERFORM waarwi_recipe.provision_enterprise('+tenant+');'
              s,n=re.subn(pattern,provision,s)
              assert n==(2 if number=='142' else 1), (p.name,n)
              dest=out/p.name
              dest.write_text(s)
              paths.append(str(dest))
              seen.add(number)
          assert seen==targets, (seen,targets)
          pathlib.Path('/tmp/waarwi-local-recipe-files.txt').write_text('\n'.join(paths)+'\n')
          PY
          total=$(wc -l </tmp/waarwi-local-recipe-files.txt)
          count=0
          failed=0
          while IFS= read -r file; do
            echo "Recette : $(basename "$file")"
            if docker exec -i -e PGPASSWORD=postgres "$db" psql -X -q -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -v VERBOSITY=default -v SHOW_CONTEXT=never -f - < "$file" >/tmp/waarwi-recipe-last.log 2>&1; then
              count=$((count+1))
              echo "OK $(basename "$file")"
            else
              failed=$((failed+1))
              grep -E 'ERROR:|DETAIL:' /tmp/waarwi-recipe-last.log | cut -c1-400 | tail -5 || true
              echo "ECHEC $(basename "$file")" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done </tmp/waarwi-local-recipe-files.txt
          echo "$count/$total recettes exécutées sans erreur SQL ; $failed échecs." | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
      - name: Vérifier la facturation IPM sur ordinateur, mobile et lien public
        id: browser
        run: |
          set -euo pipefail
          db=$(cat /tmp/waarwi-replay-container.txt)
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 0
          local_net=waarwi-browser-internal
          docker network create --internal "$local_net" >/dev/null
          docker network connect --alias db --alias supabase_db_waarwi_history_replay "$local_net" "$db"
          for component in auth rest; do
            service="supabase_${component}_waarwi_history_replay"
            docker network connect "$local_net" "$service"
            docker restart "$service" >/dev/null
          done
          test "$(docker network inspect -f '{{.Internal}}' "$local_net")" = true
          test "$(docker inspect -f '{{len .NetworkSettings.Networks}}' "$db")" = 1
          echo 'Supabase local reconnecté sur un réseau interne sans sortie externe.'
          local_env="$RUNNER_TEMP/waarwi-local-supabase.env"
          read_local_key() {
            sed -n "s/^$1=\"\(.*\)\"$/\1/p" "$local_env"
          }
          export VITE_SUPABASE_URL='http://127.0.0.1:54321'
          export VITE_SUPABASE_ANON_KEY="$(read_local_key ANON_KEY)"
          export RECIPE_SERVICE_ROLE_KEY="$(read_local_key SERVICE_ROLE_KEY)"
          test -n "$VITE_SUPABASE_ANON_KEY" && test -n "$RECIPE_SERVICE_ROLE_KEY"
          echo "::add-mask::$VITE_SUPABASE_ANON_KEY"
          echo "::add-mask::$RECIPE_SERVICE_ROLE_KEY"
          export RECIPE_DB_CONTAINER="$db"
          browser_deps="$RUNNER_TEMP/waarwi-playwright"
          npm ci --no-audit --no-fund
          npm install --prefix "$browser_deps" --no-audit --no-fund playwright@1.56.1
          "$browser_deps/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$browser_deps/node_modules/playwright/index.mjs"
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/waarwi-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-connrefused 'http://127.0.0.1:4173/' >/dev/null
          curl --silent --show-error --fail --retry 15 --retry-delay 1 --retry-connrefused 'http://127.0.0.1:54321/auth/v1/health' -H "apikey: $VITE_SUPABASE_ANON_KEY" >/dev/null
          node tests/browser/billing-ipm.mjs
      - name: Vérifier les empreintes du lot rejoué
        working-directory: ${{ runner.temp }}/waarwi-ordered-migrations
        run: sha256sum --check SHA256SUMS
      - name: Conserver le lot de migrations testé
        uses: actions/upload-artifact@v4
        with:
          name: waarwi-migrations-candidates
          path: ${{ runner.temp }}/waarwi-ordered-migrations
          if-no-files-found: error
      - name: Publier les statuts du commit (sans déploiement)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          INVENTORY: ${{ steps.inventory.outcome }}
          INITIALIZE: ${{ steps.initialize.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
          RECIPES: ${{ steps.recipes.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          node --input-type=module <<'JS'
          const url=process.env.GITHUB_API_URL+'/repos/'+process.env.GITHUB_REPOSITORY+'/statuses/'+process.env.GITHUB_SHA;
          const target=process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          for(const name of ['inventory','initialize','replay','candidate','fixtures','recipes','browser']){
            const outcome=process.env[name.toUpperCase()];
            const state=outcome==='success'?'success':outcome==='failure'?'failure':'error';
            const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({state,context:'waarwi-history/'+name,description:outcome||'not run',target_url:target})});
            if(!res.ok)throw new Error('HTTP '+res.status);
          }
          JS
